[project]
name = "casda"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
    { name = "Kovi Rose", email = "kovi.rose@sydney.edu.au" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "click>=8.0",
    "keyring>=23.0",
    "matplotlib>=3.5",
    "numpy>=1.21",
    "pandas>=1.4",
]

[project.scripts]
casda = "casda_extractor.cli:main"

[project.urls]
"Source Code" = "https://github.com/krose098/casda"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
casa = [
    "casatasks>=6.0",  # Linux only; provides CASA imfit/imstat for casda imfit
]
dev = [
    "asv==0.6.5", # Used to compute performance benchmarks
    "jupyter", # Clears output from Jupyter notebooks
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff", # Used for static linting of files
]

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/casda_extractor/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 110

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["CASDA_Cutouts.ipynb"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "N",
    "UP",
    "B",
    "SIM",
    "I",
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
]

ignore = [
    "UP006",
    "UP007",
    "SIM114",
    "B028",
    "SIM117",
    "UP015",
    "UP028",
]

[tool.coverage.run]
omit=["src/casda_extractor/_version.py"]
